spring:
  config:
    activate:
      on-profile: dev
  
  # Database configuration for WSL local PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/workout_tracker_dev
    username: workout_user
    password: myPassword123
    driver-class-name: org.postgresql.Driver
  
  # JPA/Hibernate configuration for development
  jpa:
    hibernate:
      ddl-auto: none # Let Flyway handle everything
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Enable Flyway for development (use your existing migrations)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: false
    validate-on-migrate: false
    repair-on-migrate: true

  # SQL initialization - FIXED configuration
  sql:
    init:
      mode: always
      data-locations: classpath:data-dev.sql
      defer-datasource-initialization: true
      continue-on-error: false
      encoding: UTF-8
      # Add this to force execution:
      platform: postgresql

  # Enhanced debug logging
  logging:
    level:
      org.springframework.jdbc: DEBUG
      org.hibernate.SQL: DEBUG
      org.hibernate.type.descriptor.sql.BasicBinder: TRACE
      com.chidituke.workout_tracker: DEBUG
      # Add these for SQL init debugging:
      org.springframework.boot.autoconfigure.sql.init: DEBUG
      org.springframework.jdbc.datasource.init: DEBUG
      org.springframework.boot.sql.init: DEBUG

# Server configuration
server:
  port: 8080

# Development-specific logging
logging:
  level:
    org.springframework.boot.autoconfigure.sql.init: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"