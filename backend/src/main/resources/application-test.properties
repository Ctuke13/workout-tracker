# =============================================================================
# TEST CONFIGURATION - Simple and clean for TestContainers
# =============================================================================

# Application Configuration
spring.application.name=WorkoutTracker-Test

# =============================================================================
# JPA/HIBERNATE CONFIGURATION FOR TESTS
# =============================================================================

# JPA Configuration - Let Flyway handle schema completely
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =============================================================================
# FLYWAY CONFIGURATION FOR TESTS
# =============================================================================

# Flyway Configuration - Proper migration management
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# =============================================================================
# CACHING DISABLED FOR TESTS
# =============================================================================

# Disable caching for predictable test behavior
spring.cache.type=none

# =============================================================================
# SECURITY & JWT CONFIGURATION FOR TESTS
# =============================================================================

# JWT Configuration for tests
app.jwtSecret=testJWTSecretKeyForWorkoutTrackerTestsThatMeetsThe512BitRequirementForHS512Algorithm2024Testing!
app.jwtExpirationMs=86400000

# =============================================================================
# LOGGING CONFIGURATION FOR TESTS
# =============================================================================

# Reduced logging for cleaner test output
logging.level.root=WARN
logging.level.com.chidituke=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
logging.level.org.testcontainers=INFO
logging.level.org.hibernate.SQL=WARN

# =============================================================================
# TEST-SPECIFIC CONFIGURATIONS
# =============================================================================

# Server port (random for tests)
server.port=0