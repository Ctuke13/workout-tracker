# =============================================================================
# WORKOUT TRACKER APPLICATION CONFIGURATION
# =============================================================================
# Application Configuration
spring.application.name=WorkoutTracker
# =============================================================================
# DATABASE CONFIGURATION
# =============================================================================
# PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/workout_tracker_dev
spring.datasource.username=workout_user
spring.datasource.password=myPassword123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.profiles.active=dev
# =============================================================================
# JPA/HIBERNATE CONFIGURATION
# =============================================================================
# JPA Configuration - Let Flyway handle schema completely
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# =============================================================================
# FLYWAY DATABASE MIGRATION CONFIGURATION
# =============================================================================
# Flyway Configuration - Proper migration management
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
# =============================================================================
# SQL INITIALIZATION CONFIGURATION
# =============================================================================
# SQL initialization - Load development data automatically
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-dev.sql
spring.sql.init.defer-datasource-initialization=true
spring.sql.init.continue-on-error=false
spring.sql.init.encoding=UTF-8
spring.sql.init.platform=postgresql
# Add SQL init debugging
logging.level.org.springframework.boot.autoconfigure.sql.init=DEBUG
logging.level.org.springframework.jdbc.datasource.init=DEBUG
logging.level.org.springframework.boot.sql.init=DEBUG
# =============================================================================
# CACHING CONFIGURATION
# =============================================================================
# Cache Configuration for Subscription Module & Performance
spring.cache.type=simple
spring.cache.cache-names=userSubscriptions,subscriptionStatus,tierChecks,subscriptionActive,subscriptionStats,public-workout-plans,popular-workout-plans,highly-rated-workout-plans
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m
# =============================================================================
# SERVER CONFIGURATION
# =============================================================================
# Server Port
server.port=8080
# =============================================================================
# SECURITY & JWT CONFIGURATION
# =============================================================================
# JWT Configuration
app.jwtSecret=myVeryLongJWTSecretKeyForWorkoutTrackerApplicationThatMeetsThe512BitRequirementForHS512Algorithm2024!
app.jwtExpirationMs=86400000
# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
# General Logging Levels
#logging.level.org.springframework.web=INFO
logging.level.com.chidituke=DEBUG
logging.level.com.chidituke.workout_tracker.service=DEBUG
# Security & Database Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.flywaydb=DEBUG
# Cache Logging (useful for development - remove in production)
logging.level.org.springframework.cache=DEBUG
logging.file.name=app.log
logging.level.com.chidituke.workout_tracker.service.scheduled_workouts.ScheduledWorkoutService=ERROR
logging.level.com.chidituke.workout_tracker.controller.workout.ScheduledWorkoutController=DEBUG
logging.level.org.springframework.web=DEBUG
# =============================================================================
# CLOUDINARY
# =============================================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
# =============================================================================
# MUTIPLE PART UPLOADS
# =============================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# =============================================================================
# FIREBASE
# =============================================================================
firebase.service-account-path=classpath:firebase-service-account.json