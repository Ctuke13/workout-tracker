# =============================================================================
# WORKOUT TRACKER TEST CONFIGURATION
# =============================================================================

# Application Configuration
spring.application.name=workout-tracker-test

# =============================================================================
# DATABASE CONFIGURATION (TestContainers)
# =============================================================================

# TestContainers will automatically override these via @ServiceConnection
# These are fallback values if TestContainers fails
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Note: TestContainers PostgreSQL will override above settings automatically

# =============================================================================
# JPA/HIBERNATE CONFIGURATION (Test Optimized)
# =============================================================================

# JPA Configuration - Let Flyway handle schema completely
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Test performance optimizations
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# =============================================================================
# FLYWAY DATABASE MIGRATION CONFIGURATION (Test)
# =============================================================================

# Flyway Configuration - Essential for migration testing
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false

# =============================================================================
# CACHING CONFIGURATION (Disabled for Testing)
# =============================================================================

# Disable caching for predictable test behavior
spring.cache.type=none

# =============================================================================
# SERVER CONFIGURATION (Test)
# =============================================================================

# Use random port for tests to avoid conflicts
server.port=0

# =============================================================================
# SECURITY & JWT CONFIGURATION (Test)
# =============================================================================

# JWT Configuration (test values)
app.jwtSecret=testVeryLongJWTSecretKeyForWorkoutTrackerTestingThatMeetsThe512BitRequirementForHS512Algorithm2024!
app.jwtExpirationMs=3600000

# =============================================================================
# LOGGING CONFIGURATION (Test Optimized)
# =============================================================================

# Reduce logging noise in tests
logging.level.root=WARN
logging.level.com.chidituke=INFO
logging.level.com.chidituke.workout_tracker=DEBUG

# TestContainers logging
logging.level.org.testcontainers=INFO
logging.level.com.github.dockerjava=WARN

# Database and Migration logging
logging.level.org.flywaydb=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Security logging (reduced for tests)
logging.level.org.springframework.security=WARN

# Cache logging (disabled since cache is disabled)
logging.level.org.springframework.cache=WARN

# =============================================================================
# TEST-SPECIFIC CONFIGURATION
# =============================================================================

# Spring Boot Test Configuration
spring.test.database.replace=none

# Management endpoints (disabled for tests)
management.endpoints.enabled-by-default=false

# Disable banner in tests
spring.main.banner-mode=off

# JPA test optimizations
spring.jpa.defer-datasource-initialization=false

# =============================================================================
# TESTCONTAINERS CONFIGURATION
# =============================================================================

# TestContainers will automatically configure these properties:
# spring.datasource.url=jdbc:postgresql://localhost:RANDOM_PORT/workout_tracker_test
# spring.datasource.username=test_user
# spring.datasource.password=test_password

# Container reuse for faster tests (if supported)
testcontainers.reuse.enable=true