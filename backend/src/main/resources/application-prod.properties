# Database - values injected by Render
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
# Disable dev data seeding
spring.sql.init.mode=never
# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
# JWT
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=86400000
# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
# Firebase
firebase.service-account-path=classpath:firebase-service-account.json
# Logging - quieter in prod
logging.level.com.chidituke=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
logging.level.org.springframework.web=WARN
logging.file.name=
# Server
server.port=${PORT:8080}
# Memory optimization for free tier
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
# Reduce cache size
spring.cache.caffeine.spec=maximumSize=200,expireAfterWrite=10m
spring.jpa.defer-datasource-initialization=false
spring.flyway.enabled=true